services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: blindbox
      MYSQL_USER: blindbox
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/blindbox?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USER: blindbox
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      DEMO_RECHARGE_ENABLED: ${DEMO_RECHARGE_ENABLED:-false}
      RATE_LIMIT_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports: ["127.0.0.1:8088:80"]
    depends_on: [backend]
volumes:
  mysql-data:
  redis-data:
  uploads:
